name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site
        run: |
          mkdir -p _site/assets/css _site/assets/past-work _site/assets/case-studies
          cp index.html favicon.png CNAME _site/
          cp joe-headshot-*.jpg _site/
          cp -R about work _site/
          cp assets/css/portfolio.css _site/assets/css/
          cp assets/past-work/thumb-world-concern-end-of-year.jpg assets/past-work/thumb-sua-homepage.jpg assets/past-work/thumb-rap-homepage.jpg _site/assets/past-work/
          for study in 01-payments 02-hardship 03-accessibility 04-design-ops; do
            mkdir -p "_site/assets/case-studies/$study"
            cp -R "assets/case-studies/$study/composed" "_site/assets/case-studies/$study/"
          done
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
